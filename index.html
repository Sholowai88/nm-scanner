<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NM Source Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background: #f0f6f7; margin: 0; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        .status { margin-top: 20px; font-weight: bold; color: #0d7377; font-size: 16px; }
        .error { color: #dc3545; }
        button { padding: 16px 32px; font-size: 18px; background: #0d7377; color: white; border: none; border-radius: 12px; margin-top: 20px; font-weight: 600; width: 100%; max-width: 300px; }
    </style>
</head>
<body>
    <h2>Scan Source Barcode</h2>
    <div id="reader"></div>
    <div id="status" class="status">Tap the button below to open the camera</div>
    <button id="startBtn">📷 Start Camera</button>

    <script>
        // --- read the origin passed by the inventory app (optional, for logging) ---
        const params = new URLSearchParams(window.location.search);
        const PARENT_ORIGIN = params.get('origin') || '*';

        let html5QrCode = null;

        document.getElementById('startBtn').addEventListener('click', function() {
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            document.getElementById('status').innerText = 'Initializing camera...';
            document.getElementById('status').className = 'status';

            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess
            ).catch(err => {
                document.getElementById('status').innerText = 'Camera Error: ' + err;
                document.getElementById('status').className = 'status error';
            });
        });

        function onScanSuccess(decodedText) {
            html5QrCode.stop().then(() => {
                document.getElementById('status').innerText = 'Barcode detected: ' + decodedText + '. Returning to app...';

                // 1) Try postMessage to the opener tab (same-tab-session, no reload)
                let sent = false;
                try {
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage(
                            { type: 'NM_BARCODE', code: decodedText },
                            PARENT_ORIGIN
                        );
                        sent = true;
                    }
                } catch (e) { /* opener blocked */ }

                // 2) Fallback for iOS when window.opener is null: write to localStorage.
                //    The inventory tab listens to 'focus' and reads it.
                try {
                    localStorage.setItem('NM_SCANNED_CODE', decodedText);
                } catch (e) { /* storage blocked */ }

                // 3) Close this tab if we were opened as a popup; otherwise show a message.
                setTimeout(() => {
                    if (window.opener) {
                        window.close();
                    } else {
                        document.getElementById('status').innerText =
                            'Scanned: ' + decodedText + '. Please return to the app tab.';
                    }
                }, 300);
            }).catch(err => {
                console.error('Failed to stop scanner', err);
            });
        }
    </script>
</body>
</html>
