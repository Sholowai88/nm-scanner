<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NM Source Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background: #f0f6f7; margin: 0; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        .status { margin-top: 20px; font-weight: bold; color: #0d7377; font-size: 16px; }
        .error { color: #dc3545; }
        button { padding: 16px 32px; font-size: 18px; background: #0d7377; color: white; border: none; border-radius: 12px; margin-top: 20px; font-weight: 600; width: 100%; max-width: 300px; }
    </style>
</head>
<body>
    <h2>Scan Source Barcode</h2>
    <div id="reader"></div>
    <div id="status" class="status">Tap the button below to open the camera</div>
    <button id="startBtn">📷 Start Camera</button>

    <script>
        // ⚠️ Confirm this is your actual Apps Script Web App URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMpbhm7o-tfIreop1l0YmF3EMT5XFsCyEPwONSJOTAYyT6VJu5npl3ZV70BQMAGaDa-A/exec';
        
        let html5QrCode = null;

        document.getElementById('startBtn').addEventListener('click', function() {
            // Directly execute within user gesture, avoid async delays
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            document.getElementById('status').innerText = 'Initializing camera...';
            document.getElementById('status').className = 'status';

            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                // iOS suggestions: avoid high fps, use object format for qrbox
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess
            ).catch(err => {
                document.getElementById('status').innerText = 'Camera Error: ' + err;
                document.getElementById('status').className = 'status error';
                // If it's a permission issue, prompt user to check settings
                if (err.includes('NotAllowedError') || err.includes('Permission')) {
                    document.getElementById('status').innerText += ' Please check Safari camera permissions for this site.';
                }
            });
        });

        function onScanSuccess(decodedText) {
            html5QrCode.stop().then(() => {
                document.getElementById('status').innerText = 'Barcode detected: ' + decodedText + '. Sending...';
                
                // Send to Apps Script
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'barcode=' + encodeURIComponent(decodedText)
                }).finally(() => {
                    // ✅ Fixed: Redirect back to main app with scanned code
                    window.location.href = APPS_SCRIPT_URL + '?scanned=' + encodeURIComponent(decodedText);
                });
            }).catch(err => {
                console.error('Failed to stop scanner', err);
            });
        }
    </script>
</body>
</html>
